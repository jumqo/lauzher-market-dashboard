const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=r=>r.ruc+'|'+r.ej;
let STATE={},me=null,view='resumen',F={},charts={},editing=false,draft={},last='';

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}

/* ---------- Sesión ---------- */
async function doLogin(){
  const email=$('#lu').value.trim().toLowerCase();
  const password=$('#lp').value;

  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    const e=$('#le');
    e.textContent='Usuario o contraseña incorrectos';
    e.classList.remove('hidden');
    return;
  }

  const user=data.user;

  const {data:perfil,error:perfilError}=await supabaseClient
    .from('perfiles_usuarios')
    .select('*')
    .eq('auth_id',user.id)
    .single();

  if(perfilError || !perfil){
    const e=$('#le');
    e.textContent='Usuario autenticado pero sin perfil configurado';
    e.classList.remove('hidden');
    return;
  }

  me={
    id:perfil.id,
    u:email,
    role:perfil.rol,
    nombre:perfil.nombre
  };

  sessionStorage.setItem('lz_me',JSON.stringify(me));
  start();
}
function logout(){sessionStorage.removeItem('lz_me');me=null;editing=false;draft={};location.reload()}
$('#lb').onclick=doLogin;$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

/* ---------- Persistencia ---------- */
async function load(){
  try{
    if(CONFIG.DB_URL){const r=await fetch(CONFIG.DB_URL+'/estado.json');STATE=(await r.json())||{}}
    else STATE=JSON.parse(localStorage.getItem('lz_estado')||'{}');
  }catch(e){console.error(e)}
}
async function persist(patch){
  Object.assign(STATE,patch);
  if(CONFIG.DB_URL){
    const r=await fetch(CONFIG.DB_URL+'/estado.json',{method:'PATCH',body:JSON.stringify(patch)});
    if(!r.ok)throw new Error('No se pudo guardar en la nube');
  }else localStorage.setItem('lz_estado',JSON.stringify(STATE));
}

/* ---------- Inicio ---------- */
async function start(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  view=me.role==='admin'?'resumen':me.role;
  $('#sub').textContent=(me.role==='admin'?'Administrador':'Ejecutivo '+me.role)+' · Meta: '+Math.round(CONFIG.META*100)+'% de ventas sobre el total de clientes';
  $('#sync').innerHTML=CONFIG.DB_URL?'<i class="fa-solid fa-cloud mr-1" style="color:#22D3EE"></i>Sincronizado en la nube':'<i class="fa-solid fa-laptop mr-1" style="color:#FBBF24"></i>Modo local';
  if(me.role==='admin')$('#upl').classList.remove('hidden');
  await load();render();
  if(CONFIG.DB_URL)setInterval(async()=>{if(editing)return;const p=JSON.stringify(STATE);await load();if(JSON.stringify(STATE)!==p)render()},CONFIG.POLL);
}
(async()=>{
  try{const s=JSON.parse(sessionStorage.getItem('lz_me')||'null');if(s&&s.role){me=s;return start()}}catch(e){}
  $('#login').classList.remove('hidden');
})();

/* ---------- Carga CSV (admin) ---------- */
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  Papa.parse(f,{header:true,skipEmptyLines:true,encoding:'UTF-8',transformHeader:h=>h.replace(/^\uFEFF/,'').trim().toUpperCase(),complete:res=>{
    const seen=new Set(),out=[];
    res.data.forEach(o=>{
      const r={ruc:String(o['RUC - DNI']||'').trim(),n:(o['NOMBRE']||'').replace(/\s+/g,' ').trim(),ct:String(o['CONTACTO']||'').trim(),dep:(o['DEPARTAMENTO']||'').trim(),prov:(o['PROVINCIA']||'').trim(),dist:(o['DISTRITO']||'').trim(),ej:(o['EJECUTIVO']||'').trim().toUpperCase()};
      if(!r.ruc||!r.ej||seen.has(K(r)))return;seen.add(K(r));out.push(r);
    });
    if(!out.length)return toast('El CSV no tiene el formato esperado');
    DATA=out;localStorage.setItem('lz_data',JSON.stringify(out));F={};render();toast(out.length+' clientes cargados');
  }});e.target.value='';
};

/* ---------- Filtros ---------- */
const ORDER=['ej','dep','prov','dist','ruc'];
function setF(k,v){const f=F[view]||(F[view]={});f[k]=v;ORDER.slice(ORDER.indexOf(k)+1).forEach(x=>delete f[x]);render()}
function setTab(t){view=t;render()}

/* ---------- Edición ---------- */
function edit(){editing=true;draft={};render()}
function cancel(){editing=false;draft={};render()}
function setV(k,fld,val){
  const cur={...(STATE[k]||{}),...(draft[k]||{})};cur[fld]=val;
  if(fld==='v'&&val==='SI')cur.c='SI';
  if(fld==='c'&&val==='NO')cur.v='NO';
  draft[k]=cur;render();
}
async function saveAll(){
  const ks=Object.keys(draft);if(!ks.length){editing=false;return render()}
  const now=new Date().toISOString(),patch={};
  ks.forEach(k=>patch[k]={c:draft[k].c||'',v:draft[k].v||'',by:me.role,t:now});
  try{await persist(patch);editing=false;draft={};toast('Cambios guardados');render()}
  catch(e){toast(e.message)}
}

/* ---------- Gráficos ---------- */
function bar(id,labels,vals,cols){
  charts[id]?.destroy();
  charts[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:cols,borderRadius:8,barThickness:34}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{beginAtZero:true,ticks:{color:'#9CA3AF',precision:0},grid:{color:'#ffffff10'}},y:{ticks:{color:'#EEEEEE',font:{family:'Poppins',weight:'600'}},grid:{display:false}}}}});
}
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={}}

/* ---------- Render ---------- */
function render(){
  if(!me)return;
  const sc0=$('#tableWrap')?.scrollTop||0;
  const tabs=me.role==='admin'?[['resumen','Resumen ejecutivo'],['FELIPE','Vista FELIPE'],['PAOLA','Vista PAOLA'],['TERESA','Vista TERESA']]:[[me.role,'Vista '+me.role]];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab ${k===view?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  destroyCharts();
  if(!DATA.length){
    $('#panel').innerHTML=`<div class="card p-12 text-center"><i class="fa-solid fa-database text-4xl mb-4" style="color:#8B5CF6"></i><h2 class="t text-lg">Aún no hay datos cargados</h2><p class="text-sm mt-2">${me.role==='admin'?'Usa el botón "Cargar CSV" para importar la base de clientes.':'Solicita al administrador que cargue la base de clientes.'}</p></div>`;return;
  }
  const isRes=view==='resumen',own=!isRes&&me.role===view,f=F[view]||(F[view]={});
  const base=DATA.filter(r=>isRes||r.ej===view);
  const sc=skip=>base.filter(r=>ORDER.every(k=>k===skip||!f[k]||r[k]===f[k]));
  const sel=(k,label)=>{const o=[...new Set(sc(k).map(r=>r[k]))].sort((a,b)=>a.localeCompare(b,'es'));
    return `<div><label class="text-xs">${label}</label><select class="inp mt-1" onchange="setF('${k}',this.value)"><option value="">Todos (${o.length})</option>${o.map(x=>`<option value="${esc(x)}" ${f[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`};
  const rs=sc();
  const val=r=>({...(STATE[K(r)]||{}),...(draft[K(r)]||{})});
  const total=rs.length,cont=rs.filter(r=>val(r).c==='SI').length,ven=rs.filter(r=>val(r).v==='SI').length;
  const meta=Math.ceil(total*CONFIG.META),avance=meta?Math.min(ven/meta*100,999):0,tasa=total?ven/total*100:0;
  const card=(ic,col,title,num,sub,extra='')=>`<div class="card p-5"><div class="flex items-center justify-between"><span class="text-xs font-semibold tracking-wide">${title}</span><i class="fa-solid ${ic}" style="color:${col}"></i></div><div class="t text-4xl mt-2">${num}</div><p class="text-xs mt-1">${sub}</p>${extra}</div>`;
  const kpis=card('fa-phone-volume','#22D3EE','CLIENTES CONTACTADOS',cont,`de ${total} clientes`)+card('fa-cart-shopping','#A78BFA','VENTAS',ven,`clientes que compraron · ${tasa.toFixed(1)}% del total`)+
    (isRes?card('fa-bullseye','#60A5FA','AVANCE DEL PLAN',avance.toFixed(1)+'%',`${ven} de ${meta} ventas mínimas (${Math.round(CONFIG.META*100)}% de ${total})`,`<div class="mt-3 h-2 rounded-full" style="background:#ffffff14"><div class="h-2 rounded-full" style="width:${Math.min(avance,100)}%;background:linear-gradient(90deg,#7C3AED,#06B6D4)"></div></div>`):'');
  const badge=v=>v==='SI'?'<span class="b si">SI</span>':v==='NO'?'<span class="b no">NO</span>':'<span class="b pe">—</span>';
  const dd=(r,fld,v)=>`<select class="inp" style="width:90px;padding:.3rem .5rem" data-k="${esc(K(r))}" onchange="setV(this.dataset.k,'${fld}',this.value)"><option value="" disabled hidden ${v?'':'selected'}>—</option><option ${v==='SI'?'selected':''}>SI</option><option ${v==='NO'?'selected':''}>NO</option></select>`;
  const head=isRes?['RUC - DNI','NOMBRE','DEPARTAMENTO','PROVINCIA','DISTRITO','EJECUTIVO','CONTACTADO','VENTAS']:['RUC - DNI','NOMBRE','CONTACTO','DEPARTAMENTO','PROVINCIA','DISTRITO','EJECUTIVO','CONTACTADO','VENTAS'];
  const body=rs.map(r=>{const v=val(r),ed=own&&editing;
    return `<tr class="hover:bg-white/5"><td>${esc(r.ruc)}</td><td class="text-[#EEEEEE]">${esc(r.n)}</td>${isRes?'':`<td>${esc(r.ct)}</td>`}<td>${esc(r.dep)}</td><td>${esc(r.prov)}</td><td>${esc(r.dist)}</td><td>${esc(r.ej)}</td><td>${ed?dd(r,'c',v.c):badge(v.c)}</td><td>${ed?dd(r,'v',v.v):badge(v.v)}</td></tr>`}).join('');
  const ctrl=own?`<div class="flex gap-2">${editing?`<button class="btn" style="background:#6B7280" onclick="cancel()">Cancelar</button>`:`<button class="btn" style="background:linear-gradient(90deg,#7C3AED,#2563EB)" onclick="edit()"><i class="fa-solid fa-pen mr-1"></i>EDITAR</button>`}<button class="btn" style="background:#0891B2" ${editing?'':'disabled'} onclick="saveAll()"><i class="fa-solid fa-floppy-disk mr-1"></i>GUARDAR</button></div>`:'';
  $('#panel').innerHTML=`
   <section class="card p-4 mb-5"><div class="grid grid-cols-2 md:grid-cols-${isRes?5:4} gap-3">${isRes?sel('ej','EJECUTIVO'):''}${sel('dep','DEPARTAMENTO')}${sel('prov','PROVINCIA')}${sel('dist','DISTRITO')}${sel('ruc','RUC - DNI')}</div></section>
   <section class="grid grid-cols-1 md:grid-cols-${isRes?3:2} gap-4 mb-5">${kpis}</section>
   <section class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-5">
     <div class="card p-5"><h3 class="t text-sm mb-3">CONTACTADO VS NO CONTACTADO</h3><div style="height:200px"><canvas id="c1"></canvas></div></div>
     <div class="card p-5"><h3 class="t text-sm mb-3">VENTAS VS NO VENTAS</h3><div style="height:200px"><canvas id="c2"></canvas></div></div>
   </section>
   <section class="card p-5"><div class="flex flex-wrap items-center justify-between gap-3 mb-3"><h3 class="t text-sm">Detalle de clientes <span class="font-normal text-xs">(${total})</span></h3>${ctrl}</div>
     ${total?`<div id="tableWrap" class="overflow-auto rounded-xl" style="max-height:480px"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`:'<p class="text-center text-sm py-8">Sin resultados para los filtros seleccionados.</p>'}</section>`;
  bar('c1',[`CONTACTADO (${cont})`,`NO CONTACTADO (${total-cont})`],[cont,total-cont],['#22D3EE','#7C3AED']);
  bar('c2',[`VENTAS (${ven})`,`NO VENTAS (${total-ven})`],[ven,total-ven],['#3B82F6','#A855F7']);
  const tw=$('#tableWrap');if(tw)tw.scrollTop=sc0;
}
</script>
</body>
</html>
