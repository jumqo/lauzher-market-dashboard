<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seguimiento BD · Grupo Lauzher</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
body{font-family:'Poppins',sans-serif;background:#0B0F19;color:#9CA3AF}
.card{background:#1F2937;border:1px solid #ffffff14;border-radius:16px}
.t{font-weight:700;color:#EEEEEE}
.inp{width:100%;background:#111827;border:1px solid #ffffff1f;border-radius:10px;color:#EEEEEE;padding:.5rem .7rem;font-size:.8rem;outline:none}
.inp:focus{border-color:#8B5CF6}
.btn{border-radius:10px;padding:.5rem 1rem;font-size:.8rem;font-weight:600;color:#fff;transition:.2s}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.4;cursor:not-allowed}
.tab{padding:.55rem 1rem;border-radius:10px;font-size:.8rem;font-weight:600;color:#9CA3AF;white-space:nowrap}
.tab.on{background:linear-gradient(90deg,#7C3AED,#2563EB);color:#EEEEEE}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.75rem}
th{position:sticky;top:0;background:#111827;color:#EEEEEE;font-weight:700;text-align:left;padding:.6rem .7rem;white-space:nowrap;z-index:1}
td{padding:.45rem .7rem;border-top:1px solid #ffffff0f}
.b{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-weight:600;font-size:.7rem}
.si{background:#06B6D433;color:#22D3EE}.no{background:#F43F5E26;color:#FB7185}.pe{background:#ffffff14;color:#9CA3AF}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#374151;border-radius:8px}
</style>
</head>
<body class="min-h-screen">

<section id="login" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-sm p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="mx-auto mb-3 w-14 h-14 rounded-2xl flex items-center justify-center text-2xl text-white" style="background:linear-gradient(135deg,#7C3AED,#06B6D4)"><i class="fa-solid fa-chart-line"></i></div>
      <h1 class="t text-xl">Grupo Lauzher</h1>
      <p class="text-xs mt-1">Seguimiento de base de datos comercial</p>
    </div>
    <label class="text-xs">Correo corporativo</label>
    <input id="lu" class="inp mb-3 mt-1" autocomplete="username" autofocus>
    <label class="text-xs">Contraseña</label>
    <input id="lp" type="password" class="inp mt-1" autocomplete="current-password">
    <p id="le" class="text-xs mt-3 hidden" style="color:#FB7185"></p>
    <button id="lb" class="btn w-full mt-5" style="background:linear-gradient(90deg,#7C3AED,#2563EB)">Ingresar</button>
  </div>
</section>

<div id="app" class="hidden max-w-7xl mx-auto p-4 md:p-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-5">
    <div>
      <h1 class="t text-xl md:text-2xl">Seguimiento BD · Plan comercial repuestos</h1>
      <p id="sub" class="text-xs mt-1"></p>
    </div>
    <div class="flex items-center gap-2">
      <span id="sync" class="text-xs px-3 py-1.5 rounded-full" style="background:#ffffff10"></span>
      <label id="upl" class="btn hidden cursor-pointer" style="background:#374151"><i class="fa-solid fa-file-csv mr-1"></i>Cargar CSV<input id="file" type="file" accept=".csv" class="hidden"></label>
      <button onclick="logout()" class="btn" style="background:#374151"><i class="fa-solid fa-right-from-bracket mr-1"></i>Salir</button>
    </div>
  </header>
  <nav id="tabs" class="flex gap-2 overflow-x-auto mb-5"></nav>
  <main id="panel"></main>
</div>

<div id="toast" class="fixed bottom-5 right-5 card px-4 py-3 text-sm hidden t"></div>

<script>
/* ============ CONFIGURACIÓN ============
   DB_URL: URL de Firebase Realtime Database (sin "/" final) para sincronizar entre usuarios.
   Vacío = modo local (los cambios se guardan solo en este navegador). */

/* ============ SUPABASE CONFIGURACIÓN v1 ============ */
const SUPABASE_URL = "https://siaraylfsjgqoiwoyvpa.supabase.co";
const SUPABASE_KEY = "sb_publishable_yGD39u_3DvDJ0UaEtQboSQ_Z75PKeDA";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function cargarDatosSupabase(){
  const {data,error}=await supabaseClient
    .from('dashboard_clientes_detalle')
    .select('*');

  if(error){
    console.error('ERROR SUPABASE CARGA:',error);
    return;
  }

  DATA=(data||[]).map(r=>({
    ruc:r.ruc_dni,
    n:r.nombre_principal,
    ct:r.contacto||'',
    dep:r.departamento,
    prov:r.provincia,
    dist:r.distrito,
    ej:(r.ejecutivo||'').toUpperCase(),
    estado:r.estado||'NO CONTACTADO',
    c:(r.estado && r.estado!=='NO CONTACTADO')?'SI':'NO',
    v:(r.estado==='GANADO')?'SI':'NO'
  }));

  console.log('CLIENTES SUPABASE:',DATA.length);
}

async function probarDatosSupabase(){

  const {data,error}=await supabaseClient
    .from('dashboard_clientes_detalle')
    .select('*')
    .limit(5);

  console.log("DATOS SUPABASE:", data);
  console.log("ERROR SUPABASE:", error);

}

const CONFIG={DB_URL:'',META:0.30,POLL:5000};
const USERS={};let DATA=[];
try{const d=JSON.parse(localStorage.getItem('lz_data')||'null');if(Array.isArray(d)&&d.length)DATA=d}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=r=>r.ruc+'|'+r.ej;
let STATE={},me=null,view='resumen',F={},charts={},editing=false,draft={},last='';

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}

/* ---------- Sesión ---------- */
async function doLogin(){
  const email=$('#lu').value.trim().toLowerCase();
  const password=$('#lp').value;

  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

if(error){
    const e=$('#le');
    e.textContent=error.message;
    e.classList.remove('hidden');
    console.error(error);
    return;
}

  const user=data.user;

const {data:perfil,error:perfilError}=await supabaseClient
.from('perfiles_usuarios')
.select('*')
.eq('auth_id',user.id)
.single();

if(perfilError || !perfil){
    const e=$('#le');
    e.textContent = perfilError 
      ? perfilError.message 
      : 'No existe perfil';
    e.classList.remove('hidden');

    console.error('ERROR PERFIL:', perfilError);
    console.log('USER ID:', user.id);
    return;
}

  me={
    id:perfil.id,
    u:email,
    role:perfil.rol.toLowerCase(),
    nombre:perfil.nombre
  };

  sessionStorage.setItem('lz_me',JSON.stringify(me));
  start();
}
function logout(){sessionStorage.removeItem('lz_me');me=null;editing=false;draft={};location.reload()}
$('#lb').onclick=doLogin;$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

/* ---------- Persistencia ---------- */
async function load(){
  try{
    if(CONFIG.DB_URL){const r=await fetch(CONFIG.DB_URL+'/estado.json');STATE=(await r.json())||{}}
    else STATE=JSON.parse(localStorage.getItem('lz_estado')||'{}');
  }catch(e){console.error(e)}
}
async function persist(patch){
  Object.assign(STATE,patch);
  if(CONFIG.DB_URL){
    const r=await fetch(CONFIG.DB_URL+'/estado.json',{method:'PATCH',body:JSON.stringify(patch)});
    if(!r.ok)throw new Error('No se pudo guardar en la nube');
  }else localStorage.setItem('lz_estado',JSON.stringify(STATE));
}

/* ---------- Inicio ---------- */
async function start(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  view=me.role==='admin'?'resumen':me.role;
  $('#sub').textContent=(me.role==='admin'?'Administrador':'Ejecutivo '+me.role)+' · Meta: '+Math.round(CONFIG.META*100)+'% de ventas sobre el total de clientes';
  $('#sync').innerHTML=CONFIG.DB_URL?'<i class="fa-solid fa-cloud mr-1" style="color:#22D3EE"></i>Sincronizado en la nube':'<i class="fa-solid fa-laptop mr-1" style="color:#FBBF24"></i>Modo local';
  if(me.role==='admin')$('#upl').classList.remove('hidden');
  await load();

await cargarDatosSupabase();

render();
  if(CONFIG.DB_URL)setInterval(async()=>{if(editing)return;const p=JSON.stringify(STATE);await load();if(JSON.stringify(STATE)!==p)render()},CONFIG.POLL);
}
(async()=>{
  try{const s=JSON.parse(sessionStorage.getItem('lz_me')||'null');if(s&&s.role){me=s;return start()}}catch(e){}
  $('#login').classList.remove('hidden');
})();

/* ---------- Carga CSV (admin) ---------- */
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  Papa.parse(f,{header:true,skipEmptyLines:true,encoding:'UTF-8',transformHeader:h=>h.replace(/^\uFEFF/,'').trim().toUpperCase(),complete:res=>{
    const seen=new Set(),out=[];
    res.data.forEach(o=>{
      const r={ruc:String(o['RUC - DNI']||'').trim(),n:(o['NOMBRE']||'').replace(/\s+/g,' ').trim(),ct:String(o['CONTACTO']||'').trim(),dep:(o['DEPARTAMENTO']||'').trim(),prov:(o['PROVINCIA']||'').trim(),dist:(o['DISTRITO']||'').trim(),ej:(o['EJECUTIVO']||'').trim().toUpperCase()};
      if(!r.ruc||!r.ej||seen.has(K(r)))return;seen.add(K(r));out.push(r);
    });
    if(!out.length)return toast('El CSV no tiene el formato esperado');
    DATA=out;localStorage.setItem('lz_data',JSON.stringify(out));F={};render();toast(out.length+' clientes cargados');
  }});e.target.value='';
};

/* ---------- Filtros ---------- */
const ORDER=['ej','dep','prov','dist','ruc'];
function setF(k,v){const f=F[view]||(F[view]={});f[k]=v;ORDER.slice(ORDER.indexOf(k)+1).forEach(x=>delete f[x]);render()}
function setTab(t){view=t;render()}

/* ---------- Edición ---------- */
function edit(){editing=true;draft={};render()}
function cancel(){editing=false;draft={};render()}
function setV(k,fld,val){
  const cur={...(STATE[k]||{}),...(draft[k]||{})};cur[fld]=val;
  if(fld==='v'&&val==='SI')cur.c='SI';
  if(fld==='c'&&val==='NO')cur.v='NO';
  draft[k]=cur;render();
}
async function saveAll(){
  const ks=Object.keys(draft);if(!ks.length){editing=false;return render()}
  const now=new Date().toISOString(),patch={};
  ks.forEach(k=>patch[k]={c:draft[k].c||'',v:draft[k].v||'',by:me.role,t:now});
  try{await persist(patch);editing=false;draft={};toast('Cambios guardados');render()}
  catch(e){toast(e.message)}
}

/* ---------- Gráficos ---------- */
function bar(id,labels,vals,cols){
  charts[id]?.destroy();
  charts[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:cols,borderRadius:8,barThickness:34}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{beginAtZero:true,ticks:{color:'#9CA3AF',precision:0},grid:{color:'#ffffff10'}},y:{ticks:{color:'#EEEEEE',font:{family:'Poppins',weight:'600'}},grid:{display:false}}}}});
}
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={}}

/* ---------- Render ---------- */
function render(){
  if(!me)return;
  const sc0=$('#tableWrap')?.scrollTop||0;
  const tabs=me.role==='admin'?[['resumen','Resumen ejecutivo'],['FELIPE','Vista FELIPE'],['PAOLA','Vista PAOLA'],['TERESA','Vista TERESA']]:[[me.role,'Vista '+me.role]];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab ${k===view?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  destroyCharts();
  if(!DATA.length){
    $('#panel').innerHTML=`<div class="card p-12 text-center"><i class="fa-solid fa-database text-4xl mb-4" style="color:#8B5CF6"></i><h2 class="t text-lg">Aún no hay datos cargados</h2><p class="text-sm mt-2">${me.role==='admin'?'Usa el botón "Cargar CSV" para importar la base de clientes.':'Solicita al administrador que cargue la base de clientes.'}</p></div>`;return;
  }
  const isRes=view==='resumen',own=!isRes&&me.role===view,f=F[view]||(F[view]={});
  const base=DATA.filter(r=>isRes||r.ej===view);
  const sc=skip=>base.filter(r=>ORDER.every(k=>k===skip||!f[k]||r[k]===f[k]));
  const sel=(k,label)=>{const o=[...new Set(sc(k).map(r=>r[k]))].sort((a,b)=>a.localeCompare(b,'es'));
    return `<div><label class="text-xs">${label}</label><select class="inp mt-1" onchange="setF('${k}',this.value)"><option value="">Todos (${o.length})</option>${o.map(x=>`<option value="${esc(x)}" ${f[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`};
  const rs=sc();
  const val=r=>({...(STATE[K(r)]||{}),...(draft[K(r)]||{})});
  const total=rs.length;
  const cont=rs.filter(r=>val(r).c==='SI').length;
  const ven=rs.filter(r=>val(r).v==='SI').length;
  const gestion=cont;
  const meta=Math.ceil(total*CONFIG.META);
  const card=(ic,col,title,num,sub,extra='')=>`<div class="card p-5"><div class="flex items-center justify-between"><span class="text-xs font-semibold tracking-wide">${title}</span><i class="fa-solid ${ic}" style="color:${col}"></i></div><div class="t text-4xl mt-2">${num}</div><p class="text-xs mt-1">${sub}</p>${extra}</div>`;
  const kpis=
    card('fa-users','#22D3EE','TOTAL CLIENTES',total,`clientes asignados`)+
    card('fa-headset','#A78BFA','EN GESTIÓN',gestion,`clientes trabajados`)+
    (isRes?card('fa-trophy','#60A5FA','GANADOS',ven,`clientes ganados`):'');
  const badge=v=>v==='SI'?'<span class="b si">SI</span>':v==='NO'?'<span class="b no">NO</span>':'<span class="b pe">—</span>';
  const dd=(r,fld,v)=>`<select class="inp" style="width:90px;padding:.3rem .5rem" data-k="${esc(K(r))}" onchange="setV(this.dataset.k,'${fld}',this.value)"><option value="" disabled hidden ${v?'':'selected'}>—</option><option ${v==='SI'?'selected':''}>SI</option><option ${v==='NO'?'selected':''}>NO</option></select>`;
  const head=isRes?['RUC - DNI','NOMBRE','DEPARTAMENTO','PROVINCIA','DISTRITO','EJECUTIVO','CONTACTADO','VENTAS']:['RUC - DNI','NOMBRE','CONTACTO','DEPARTAMENTO','PROVINCIA','DISTRITO','EJECUTIVO','CONTACTADO','VENTAS'];
  const body=rs.map(r=>{const v=val(r),ed=own&&editing;
    return `<tr class="hover:bg-white/5"><td>${esc(r.ruc)}</td><td class="text-[#EEEEEE]">${esc(r.n)}</td>${isRes?'':`<td>${esc(r.ct)}</td>`}<td>${esc(r.dep)}</td><td>${esc(r.prov)}</td><td>${esc(r.dist)}</td><td>${esc(r.ej)}</td><td>${ed?dd(r,'c',v.c):badge(v.c)}</td><td>${ed?dd(r,'v',v.v):badge(v.v)}</td></tr>`}).join('');
  const ctrl=own?`<div class="flex gap-2">${editing?`<button class="btn" style="background:#6B7280" onclick="cancel()">Cancelar</button>`:`<button class="btn" style="background:linear-gradient(90deg,#7C3AED,#2563EB)" onclick="edit()"><i class="fa-solid fa-pen mr-1"></i>EDITAR</button>`}<button class="btn" style="background:#0891B2" ${editing?'':'disabled'} onclick="saveAll()"><i class="fa-solid fa-floppy-disk mr-1"></i>GUARDAR</button></div>`:'';
  $('#panel').innerHTML=`
   <section class="card p-4 mb-5"><div class="grid grid-cols-2 md:grid-cols-${isRes?5:4} gap-3">${isRes?sel('ej','EJECUTIVO'):''}${sel('dep','DEPARTAMENTO')}${sel('prov','PROVINCIA')}${sel('dist','DISTRITO')}${sel('ruc','RUC - DNI')}</div></section>
   <section class="grid grid-cols-1 md:grid-cols-${isRes?3:2} gap-4 mb-5">${kpis}</section>
   <section class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-5">
     <div class="card p-5"><h3 class="t text-sm mb-3">DISTRIBUCIÓN POR ESTADO</h3><div style="height:200px"><canvas id="c1"></canvas></div></div>
     <div class="card p-5"><h3 class="t text-sm mb-3">${isRes?"CARTERA POR EJECUTIVO":"TOP PROVINCIAS"}</h3><div style="height:200px"><canvas id="c2"></canvas></div></div>
   </section>
   <section class="card p-5"><div class="flex flex-wrap items-center justify-between gap-3 mb-3"><h3 class="t text-sm">Detalle de clientes <span class="font-normal text-xs">(${total})</span></h3>${ctrl}</div>
     ${total?`<div id="tableWrap" class="overflow-auto rounded-xl" style="max-height:480px"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`:'<p class="text-center text-sm py-8">Sin resultados para los filtros seleccionados.</p>'}</section>`;
  const estados=['NO CONTACTADO','CONTACTADO','INTERESADO','COTIZACION','GANADO','PERDIDO'];
  const estadoVals=estados.map(e=>rs.filter(r=>(val(r).estado||'NO CONTACTADO')===e).length);

  bar('c1',
    estados.map(e=>`${e} (${estadoVals[estados.indexOf(e)]})`),
    estadoVals,
    ['#22D3EE','#3B82F6','#A855F7','#F59E0B','#10B981','#F43F5E']
  );

  if(isRes){
    const ejecutivos=[...new Set(rs.map(r=>r.ej))].filter(Boolean);
    const ejecutivoVals=ejecutivos.map(e=>rs.filter(r=>r.ej===e).length);

    bar('c2',
      ejecutivos.map(e=>`${e} (${rs.filter(r=>r.ej===e).length})`),
      ejecutivoVals,
      ['#7C3AED','#06B6D4','#A855F7']
    );
  }else{
    const provincias=[...new Set(rs.map(r=>r.prov))].filter(Boolean);
    const topProvincias=provincias
      .map(p=>({p,n:rs.filter(r=>r.prov===p).length}))
      .sort((a,b)=>b.n-a.n)
      .slice(0,5);

    bar('c2',
      topProvincias.map(x=>`${x.p} (${x.n})`),
      topProvincias.map(x=>x.n),
      ['#06B6D4','#7C3AED','#A855F7','#F59E0B','#10B981']
    );
  }
  const tw=$('#tableWrap');if(tw)tw.scrollTop=sc0;
}
</script>
</body>
</html>
